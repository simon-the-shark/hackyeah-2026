services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: elder
      POSTGRES_PASSWORD: elder
      POSTGRES_DB: elder_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
